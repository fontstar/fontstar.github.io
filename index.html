<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FontStar - Your Safari Reading Experience</title>
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- Page-Specific Carousel Styles -->
    <style>
        /* Modern Mobile Peeking Carousel with CSS Scroll Snap */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 1rem; /* Space between slides */
            padding-bottom: 1.5rem; /* Space for scrollbar on desktop */
            margin-top: 3rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            /* Hide standard scrollbar for clean look */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .carousel-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, and Opera */
        }

        .slide {
            flex: 0 0 calc(85% - 1rem); /* 85% width on mobile creates the 'peeking' edge */
            scroll-snap-align: center; /* Snap to center of slide */
            display: flex;
            justify-content: center; /* Center the image within the slide space */
            align-items: center;
            border-radius: 16px;
            overflow: hidden;
            background-color: transparent; /* Text areas are part of screenshots, so slides are minimal */
        }

        /* Large Screen Media Query for standard layout on Desktop */
        @media (min-width: 800px) {
            .carousel-container {
                gap: 2rem;
            }
            .slide {
                flex: 0 0 calc(50% - 2rem); /* Show 2 slides nicely on large screens */
            }
        }

        .slide-image {
            width: 100%;
            height: auto;
            border-radius: 16px; /* Rounded frame for images */
        }

        /* Standard App Store Button styling */
        .app-store-button-container {
            margin-top: 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .app-store-button {
            display: inline-block;
        }
        .app-store-button img {
            height: 60px; /* matched from screenshots */
            width: auto;
        }

    </style>
</head>
<body>

    <main>
        <!-- Logo and Hero Headline -->
        <div style="text-align: center; margin-top: 3rem;">
            <img src="/images/logo.png" alt="FontStar Logo" style="height: 100px; width: auto;">
            <!-- Removed duplicative H1 headline -->
            
            <!-- CTA Button: Hero -->
            <div class="app-store-button-container">
                <a href="https://apps.apple.com/us/app/fontstar-for-safari/id6751470918" class="app-store-button" target="_blank" rel="noopener noreferrer">
                    <img src="/images/app-store-badge.svg" alt="Download on the App Store">
                </a>
            </div>
        </div>

        <!-- 5-Slide Mobile Peeking Carousel (Images Only) -->
        <div class="carousel-container">

            <!-- Slide 1 -->
            <div class="slide">
                <!-- Removed all text and description divs. Images fill the slides. -->
                <img src="/images/feature1.jpg" alt="FontStar Feature 1" class="slide-image">
            </div>

            <!-- Slide 2 -->
            <div class="slide">
                <img src="/images/feature2.jpg" alt="FontStar Feature 2" class="slide-image">
            </div>

            <!-- Slide 3 -->
            <div class="slide">
                <img src="/images/feature3.jpg" alt="FontStar Feature 3" class="slide-image">
            </div>

            <!-- Slide 4 -->
            <div class="slide">
                <!-- Removed HTML descriptions and CJK bubble overlays. Image-only. -->
                <img src="/images/feature4.jpg" alt="FontStar Feature 4" class="slide-image">
            </div>

            <!-- Slide 5 -->
            <div class="slide">
                <img src="/images/feature5.jpg" alt="FontStar Feature 5" class="slide-image">
            </div>

        </div>

        <!-- Get FontStar Section (matched from image_4.png) -->
        <div style="text-align: center; margin-top: 5rem; margin-bottom: 5rem;">
            <!-- Removed the "Get FontStar..." headline -->
            
            <!-- CTA Button: End of Page -->
            <div class="app-store-button-container">
                <a href="https://apps.apple.com/us/app/fontstar-for-safari/id6751470918" class="app-store-button" target="_blank" rel="noopener noreferrer">
                    <img src="/images/app-store-badge.svg" alt="Download on the App Store">
                </a>
            </div>
        </div>

    </main>

    {% include footer.html %}

</body>
</html>
